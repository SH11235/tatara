name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同一 PR の続けざまの push は前の run をキャンセルする
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # nnue-format 等の数値テストは opt-level 0 だと 1 binary で ~50s 掛かる。
  # debug-assertions / overflow-checks は opt-level と独立なので検査内容は変わらない。
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml の components (rustc-dev / rust-analyzer / llvm-tools 等) は
      # GPU 開発用で CI では使わず、自動インストールさせると毎回 ~20s 掛かる。
      # channel だけ読んで minimal profile で入れ、RUSTUP_TOOLCHAIN で toml を素通りさせる。
      - name: install Rust toolchain
        run: |
          channel=$(sed -nE 's/^channel\s*=\s*"([^"]+)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      # PR ごとに ~150MB 保存すると main の cache を押し出すため、保存は main だけにする。
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # workspace.members が空 (`[]`) のときは `cargo --workspace` が
      #   "manifest is virtual, and the workspace has no members"
      # で fail するため、空 workspace では fmt/clippy/test を skip する。
      - name: detect empty workspace
        id: ws
        run: |
          if grep -qE '^members\s*=\s*\[\s*\]' Cargo.toml; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "::notice::workspace has no members yet; fmt/clippy/test skipped"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo fmt --check
        if: steps.ws.outputs.empty == 'false'
        run: cargo fmt --all -- --check

      # 以下の --exclude リストは GPU (CUDA toolkit + LLVM 21+ + cuda-oxide) を
      # 必要とする crate 一式。`#[kernel]` macro 展開で `cuda_host::CudaKernel` が
      # 要求され、transitive な cuda-bindings build script が `cuda.h` を必要と
      # するため GitHub-hosted runner では build できない。新しい GPU 依存 crate
      # を追加するときも --exclude を更新すること (CPU full check は
      # `scripts/local-ci.sh` で別途回す)。
      - name: cargo clippy
        if: steps.ws.outputs.empty == 'false'
        run: |
          cargo clippy --workspace --all-targets --exclude gpu-runtime --exclude progress-kpabs-train --exclude nnue-trainer -- -D warnings
          cargo clippy -p nnue-trainer --no-default-features --all-targets -- -D warnings
          # gpu-runtime の backend feature なし stub 構成。CUDA 不要でこの runner で
          # build できるため、gate 漏れ (backend 依存 item の cfg 抜け) をここで検出する。
          cargo clippy -p gpu-runtime --no-default-features --all-targets -- -D warnings

      - name: cargo test
        if: steps.ws.outputs.empty == 'false'
        run: |
          cargo test --workspace --exclude gpu-runtime --exclude progress-kpabs-train --exclude nnue-trainer
          cargo test -p nnue-trainer --no-default-features
