# Channel は cuda-oxide の ABI-unstable な rustc codegen API と、trainer が使う
# f16 言語機能のため nightly に固定する。cuda-oxide 利用時は upstream の
# rust-toolchain.toml と揃え、codegen backend の ABI ずれを防ぐ。
[toolchain]
channel = "nightly-2026-04-03"
components = ["rust-src", "rustc-dev", "rust-analyzer", "clippy", "llvm-tools"]
